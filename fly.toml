# fly.toml app configuration file generated for nexow-server on 2026-02-17T14:57:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexow-server'
primary_region = 'iad'

[build]
[env]
  PORT = "8000"
  # Point this at your sandbox Fly app (internal DNS):
  # SANDBOX_URL = "http://nexow-sandbox.internal:3001"
  #
  # Point this at your Redis (Upstash/Fly Redis):
  # REDIS_URL = "redis://..."

[processes]
  api = "uvicorn nexow.api.app:app --host 0.0.0.0 --port 8000"
  worker = "python -m nexow.worker"
  poller = "python -m nexow.poller"
  snapshot = "python -m nexow.snapshot"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
