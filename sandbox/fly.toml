app = "nexow-sandbox"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Pyodide is memory-heavy; start small and scale up if needed.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

[env]
  SANDBOX_PORT = "3001"
  SANDBOX_POOL_SIZE = "1"

[processes]
  app = "pnpm start"

# HTTP service so Fly keeps at least one machine running and can route traffic.
# nexow-server should use SANDBOX_URL=http://nexow-sandbox.internal:3001 (private).
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
