[project]
name = "nexow-server"
version = "0.1.0"
description = "Nexow trading platform — API server and background worker"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "httpx>=0.26",
    # Database
    "supabase>=2.0",
    # Cache / pub-sub
    "redis>=5.0",
    # Data / ML
    "pandas>=2.0",
    "numpy>=1.26",
    "ta>=0.11",
    # LLM
    "pydantic-ai>=0.0.14",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    # Config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # Logging
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexow"]

[tool.ruff]
line-length = 100
target-version = "py311"
